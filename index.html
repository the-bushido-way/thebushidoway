<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bushido Way - Portal Principal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <main class="bushido-wrapper">
        <header class="dojo-header">
            <h1 class="dojo-title">THE BUSHIDO WAY</h1>
            <div id="auth-status-badge" class="status-badge unverified">No Verificado</div>
        </header>

        <section id="auth-container" class="card-section">
            <div id="login-panel">
                <p class="section-desc">Conecta tu cuenta de Google para acceder al dojo y sincronizar tu progreso.</p>
                <div id="g_id_onload"
                     data-client_id="345741995794-71jf37bduotlhd5fco01mvvptm8s0th0.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="filled_black"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left"
                     data-width="100%">
                </div>
            </div>

            <div id="session-panel" style="display: none;">
                <p id="user-email-display" class="user-email"></p>
                
                <div id="verification-group" class="verification-box">
                    <p class="verify-text">Verifica tu perfil para desbloquear las secciones completas.</p>
                    <input type="text" id="verification-code-input" class="form-input" placeholder="Código de 6 dígitos" maxlength="6">
                    <button id="verify-code-btn" class="btn btn-primary">Confirmar Código</button>
                </div>

                <button id="logout-btn" class="btn btn-danger">Cerrar Sesión (Cambiar cuenta)</button>
            </div>
        </section>

        <nav id="dojo-nav-grid" class="nav-grid disabled-nav">
            <a href="blog.html" class="nav-card">
                <span class="card-icon">✍️</span>
                <span class="card-label">Blog</span>
            </a>
            <a href="chats.html" class="nav-card">
                <span class="card-icon">💬</span>
                <span class="card-label">Chats</span>
            </a>
            <a href="clasificacion.html" class="nav-card">
                <span class="card-icon">🏆</span>
                <span class="card-label">Clasificación</span>
            </a>
            <a href="eventos.html" class="nav-card">
                <span class="card-icon">📅</span>
                <span class="card-label">Eventos</span>
            </a>
            <a href="foro.html" class="nav-card">
                <span class="card-icon">🗣️</span>
                <span class="card-label">Foro</span>
            </a>
            <a href="fotos.html" class="nav-card">
                <span class="card-icon">📷</span>
                <span class="card-label">Fotos</span>
            </a>
            <a href="tutoriales.html" class="nav-card">
                <span class="card-icon">📚</span>
                <span class="card-label">Tutoriales</span>
            </a>
        </nav>
    </main>

    <div id="toast-container"></div>

    <script src="script.js" type="module"></script>
</body>
</html>
