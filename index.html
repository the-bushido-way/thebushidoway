<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bushido Way</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(59, 130, 246, 0.3);
            --text-color: #ffffff;
            --text-muted: #9ca3af;
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(59, 130, 246, 0.2);
            --text-color: #1f2937;
            --text-muted: #4b5563;
            --accent-color: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Lienzo de fondo interactivo estilo Cloudflare Grid */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            z-index: 10;
        }

        .config-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .config-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px var(--accent-glow);
            text-align: center;
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .badge-container {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .server-status {
            color: var(--accent-color);
            font-family: monospace;
            font-size: 0.85rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .welcome-box h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .welcome-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .menu-card:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .menu-card span {
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Fondo Interactivo de Cuadrícula Dinámica -->
    <canvas id="bgCanvas"></canvas>

    <div class="top-bar">
        <a href="config.html" class="config-btn">
            ⚙️ Configuración y Cuenta
        </a>
    </div>

    <div class="main-container">
        <h1>The Bushido Way</h1>
        
        <div class="badge-container">
            RANGO: Novato I // CLASE: S+
        </div>

        <div class="stats-row">
            <div class="stat-badge">💎 0 Pts</div>
            <div class="stat-badge">⚡ 0 XP</div>
        </div>

        <div class="server-status">
            SISTEMA ONLINE // PUERTO 8000
        </div>

        <div class="welcome-box">
            <h2>Bienvenido a la Comunidad</h2>
            <p>Explora las secciones interactivas, participa con otros miembros y construye tu camino paso a paso.</p>
        </div>

        <div class="grid-menu">
            <a href="juegos.html" class="menu-card">
                🎮
                <span>Juegos</span>
            </a>
            <a href="blogs.html" class="menu-card">
                ✍️
                <span>Blogs</span>
            </a>
            <a href="tutoriales.html" class="menu-card">
                📚
                <span>Tutoriales</span>
            </a>
            <a href="comunidad.html" class="menu-card">
                💬
                <span>Comunidad</span>
            </a>
        </div>
    </div>

    <script>
        // Cargar tema guardado
        const savedTheme = localStorage.getItem('bushido_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Efecto de cuadrícula interactiva con el cursor (Estilo Cloudflare Connect)
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        const gridSize = 25; // Tamaño de cada celda de la cuadrícula

        function drawGrid() {
            ctx.clearRect(0, 0, width, height);

            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const baseColor = isDark ? 50 : 200;
            const activeColor = isDark ? 120 : 50;

            for (let x = gridSize / 2; x < width; x += gridSize) {
                for (let y = gridSize / 2; y < height; y += gridSize) {
                    let dx = mouse.x - x;
                    let dy = mouse.y - y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    
                    let maxDist = 140;
                    let size = 3;
                    let alpha = isDark ? 0.15 : 0.25;

                    if (dist < maxDist) {
                        let factor = (1 - dist / maxDist);
                        size = 3 + factor * 5; // Los cuadrados crecen al pasar el cursor
                        alpha = Math.min(1, alpha + factor * 0.7);
                    }

                    ctx.fillStyle = isDark 
                        ? `rgba(59, 130, 246, ${alpha})` 
                        : `rgba(37, 99, 235, ${alpha})`;
                    
                    ctx.fillRect(x - size / 2, y - size / 2, size, size);
                }
            }
            requestAnimationFrame(drawGrid);
        }

        requestAnimationFrame(drawGrid);
    </script>
</body>
</html>
