<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bushido Way | Menú Principal</title>
    <style>
        :root {
            --bg-deep: #070913;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --primary-neon: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        .cyber-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
        }

        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 700px; height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .menu-container {
            text-align: center;
            max-width: 900px;
            width: 90%;
            padding: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .dojo-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, var(--primary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .dojo-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .player-status-bar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .player-status-bar strong {
            color: #fbbf24;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        .menu-btn {
            position: relative;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 18px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .menu-btn span.icon {
            font-size: 1.5rem;
        }

        .menu-btn:hover {
            transform: translateY(-4px);
            border-color: var(--primary-neon);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        /* Estilo destacado exclusivo para la Tienda */
        .menu-btn.shop-highlight {
            background: linear-gradient(135deg, #4c1d95, #7c3aed);
            border-color: var(--primary-neon);
            box-shadow: 0 4px 15px var(--primary-glow);
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="ambient-glow"></div>

    <div class="menu-container">
        <h1 class="dojo-title">THE BUSHIDO WAY</h1>
        <p class="dojo-subtitle">Elige tu camino, guerrero</p>

        <div class="player-status-bar">
            <span>Bushido Coins: <strong id="menu-balance">0</strong> 🪙</span>
        </div>

        <!-- Reincorporación completa de todos tus botones originales -->
        <div class="menu-grid">
            <button class="menu-btn" onclick="mostrarEnConstruccion('Entrenamiento')">
                <span class="icon">⚔️</span>
                <span>Entrenamiento</span>
            </button>
            
            <button class="menu-btn" onclick="mostrarEnConstruccion('Mi Perfil & Avatar')">
                <span class="icon">🛡️</span>
                <span>Mi Perfil & Avatar</span>
            </button>
            
            <!-- TIENDA ACTIVA Y CONECTADA -->
            <a href="shop.html" class="menu-btn shop-highlight">
                <span class="icon">⚡</span>
                <span>Dojo Shop</span>
            </a>
            
            <button class="menu-btn" onclick="mostrarEnConstruccion('Salón de la Fama')">
                <span class="icon">🏆</span>
                <span>Salón de la Fama</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const monedas = localStorage.getItem('bushido_coins') || '0';
            const balanceEl = document.getElementById('menu-balance');
            if (balanceEl) {
                balanceEl.textContent = monedas;
            }
        });

        function mostrarEnConstruccion(seccion) {
            const aviso = document.createElement('div');
            aviso.style.position = 'fixed';
            aviso.style.bottom = '20px';
            aviso.style.left = '50%';
            aviso.style.transform = 'translateX(-50%)';
            aviso.style.background = '#334155';
            aviso.style.color = '#f8fafc';
            aviso.style.border = '1px solid #64748b';
            aviso.style.padding = '12px 24px';
            aviso.style.borderRadius = '8px';
            aviso.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
            aviso.style.zIndex = '1000';
            aviso.style.fontSize = '0.9rem';
            aviso.textContent = `🚧 La sección "${seccion}" está siendo forjada próximamente.`;
            
            document.body.appendChild(aviso);
            setTimeout(() => aviso.remove(), 3000);
        }
    </script>
</body>
</html>
