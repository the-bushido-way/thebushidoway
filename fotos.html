<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bushido Way - Galería de Fotos</title>
    <link rel="stylesheet" href="fotos-style.css">
    <!-- Script preventivo para carga inmediata del tema -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('bushido_theme') || 'dark';
            const isHighContrast = localStorage.getItem('bushido_contrast') === 'true';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (isHighContrast) document.documentElement.setAttribute('data-contrast', 'high');
        })();
    </script>
</head>
<body>

    <header class="main-dashboard-header">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="settings-gear-btn" title="Volver">
                ‹ Volver al Menú
            </a>
        </div>
        <div>
            <h1 class="bushido-title-3d">GALERÍA DE FOTOS</h1>
            <p class="header-subtitle">Momentos épicos y memorias del dojo.</p>
        </div>
    </header>

    <main class="config-container">
        <section class="config-group-card" style="text-align: center; padding: 40px 20px;">
            <h3>🖼️ Archivo de Recuerdos</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Próximamente se sincronizarán aquí todas las capturas y momentos clave de las katas.</p>
        </section>
    </main>

    <script src="fotos-script.js"></script>
</body>
</html>
